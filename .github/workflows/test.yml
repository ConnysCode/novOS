# Tests that need no TV, on every push and pull request.
name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test signing, manifests and channels
        run: python3 lib/release/test_release.py
      - name: Test novos-setupd in a sandbox
        run: python3 apps/setup/tv/test_setupd.py
      - name: Test novOS' updater start in a sandbox
        run: python3 apps/novos/install/test_updater.py

  cli:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/cli/go.sum
      - name: Vet, test and build the novos program
        run: |
          go generate ./...
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          GOOS=windows go build -o /dev/null .
          GOOS=darwin go build -o /dev/null .
