# Builds the novos program for Mac, Windows and Linux when a tag cli-v<version> is pushed,
# and publishes the archives with SHA256SUMS, signed with the release key like every release.
name: Release novos CLI

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/cli/go.sum

      - name: Read the version from the tag
        run: |
          version="${TAG#cli-v}"
          python3 lib/release/release.py channel --app cli --version "$version" \
              --manifest-url - --signature-url - > /dev/null
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        working-directory: apps/cli
        run: |
          go generate ./...
          go vet ./...
          go test ./...
          python3 ../setup/tv/test_setupd.py

      - name: Build for every system
        working-directory: apps/cli
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
              os=${target%/*}; arch=${target#*/}
              name="novos-$VERSION-$os-$arch"
              binary=novos; [ "$os" = windows ] && binary=novos.exe
              mkdir -p "build/$name"
              GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "build/$name/$binary" .
              cp ../../README.md "build/$name/"
              if [ "$os" = windows ]; then
                  (cd build && zip -qr "../dist/$name.zip" "$name")
              else
                  tar -C build -czf "dist/$name.tar.gz" "$name"
              fi
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Sign the checksums
        env:
          NOVOS_SIGNING_KEY: ${{ secrets.NOVOS_SIGNING_KEY }}
        run: python3 lib/release/release.py sign apps/cli/dist/SHA256SUMS > apps/cli/dist/SHA256SUMS.sig

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --title "novos CLI $VERSION" --generate-notes $prerelease \
              apps/cli/dist/*
